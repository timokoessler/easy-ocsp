name: 🔍 Code quality

on:
    push:
        branches:
            - 'main'
    pull_request:
permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout repository ⬇️
              uses: actions/checkout@v5

            - name: Use Node.js 24.x ⚙️
              uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  cache: 'npm'

            - name: Install dependencies 📦
              run: npm ci

            - name: Run linter 🧹
              run: node --run lint

            - name: Check formatting ✨
              run: node --run check:format

            - name: Check types 🔍
              run: node --run check:types
